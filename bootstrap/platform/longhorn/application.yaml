apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.7.1
    helm:
      parameters:
        - name: preUpgradeChecker.jobEnabled
          value: "false"
        # Replicas per volume for the default "longhorn" StorageClass.
        # 1 = no redundancy (single storage node). Use 2-3 with that many storage nodes.
        - name: persistence.defaultClassReplicaCount
          value: "1"
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
  # Kubernetes injects preserveUnknownFields: false into v1 CRDs, which the chart
  # omits; ignore that cosmetic drift so the app does not show OutOfSync forever.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/preserveUnknownFields
