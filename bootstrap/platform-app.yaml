# Cluster prerequisites: ingress, load balancer, certificates, storage, metrics.
# Replace REPLACE_ME_GIT_REPO_URL with the URL of YOUR fork (see VALUES.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: REPLACE_ME_GIT_REPO_URL
    targetRevision: main
    path: bootstrap/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Custom resources (IPAddressPool, ClusterIssuer, RecurringJob) are created in the
    # same sync as the charts that install their CRDs; retry until the CRDs exist.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
