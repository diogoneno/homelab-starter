# ArgoCD UI behind ingress-nginx. argocd-server serves TLS itself, hence backend-protocol HTTPS.
# Replace the host (see VALUES.md) and point DNS (or /etc/hosts) at the ingress LoadBalancer IP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx
  rules:
    - host: argocd.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 443
