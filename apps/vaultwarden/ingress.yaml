# Bitwarden clients refuse plain HTTP, so this ingress always terminates TLS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden
  namespace: vaultwarden
  annotations:
    cert-manager.io/cluster-issuer: selfsigned-issuer
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - vaultwarden.example.internal
      secretName: vaultwarden-tls
  rules:
    - host: vaultwarden.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultwarden
                port:
                  number: 80
