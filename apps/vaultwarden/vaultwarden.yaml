apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-data
  namespace: vaultwarden
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO volume, see apps/trilium
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      containers:
        - name: vaultwarden
          # Unpinned upstream tag. Pin a release for reproducible upgrades.
          image: vaultwarden/server:latest
          env:
            - name: DOMAIN
              value: https://vaultwarden.example.internal
            - name: WEBSOCKET_ENABLED
              value: "true"
            # Leave "true" until you have created your own account, then set "false"
            # and push: otherwise anyone who can reach the URL can register.
            - name: SIGNUPS_ALLOWED
              value: "true"
            # Optional admin panel (/admin). Disabled unless the Secret exists.
            # See SECRETS.md -> vaultwarden-admin.
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-admin
                  key: ADMIN_TOKEN
                  optional: true
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  selector:
    app: vaultwarden
  ports:
    - port: 80
      targetPort: 80
